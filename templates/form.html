{% extends 'base.html' %}
{% block title %}{{ title }} · Music Event Discovery{% endblock %}
{% block content %}
<section class="narrow"><h1>{{ title }}</h1>
{% if hint %}<p class="muted">{{ hint }}</p>{% endif %}
{% if venue_link %}<p><a href="{% url 'venue-new' %}">Propose a new venue</a></p>{% endif %}
<form method="post" enctype="multipart/form-data">{% csrf_token %}{{ form.as_p }}<button type="submit">Save</button></form>
</section>
{% endblock %}
